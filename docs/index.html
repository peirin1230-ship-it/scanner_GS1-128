<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta name="theme-color" content="#0891B2" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="LinQ VAL" />
  <meta name="description" content="バーコードスキャンで医療材料の使用実績を記録・承認・請求突合するアプリ" />
  <title>LinQ VAL</title>

  <link rel="manifest" href="./manifest.json" />
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <link rel="apple-touch-icon" href="./icons/icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700;900&family=Noto+Sans+JP:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    /* ═══════════════════════════════════════════
       LinQ VAL — Medical UI v3
       Design: Clinical Trust × Accessible Care
       Palette: Teal + Slate (ui-ux-pro-max)
       ═══════════════════════════════════════════ */

    :root{
      --primary:#0891B2;
      --primary2:#22D3EE;
      --primary-dark:#0E7490;
      --primary-glow:rgba(8,145,178,.18);
      --tint:#E0F2FE;
      --tint2:#F0F9FF;
      --tint3:#E0F7FA;
      --green:#059669;
      --green-bg:#ecfdf5;
      --green-border:#d1fae5;
      --blue:#3b82f6;
      --amber:#f59e0b;
      --amber-bg:#fef3c7;
      --amber-light:#fffbeb;
      --amber-text:#92400e;
      --amber-border:#fde68a;
      --danger:#DC2626;
      --danger-light:#FEF2F2;
      --danger-glow:rgba(220,38,38,.18);
      --text:#0F172A;
      --text2:#334155;
      --muted:#64748B;
      --muted2:#94A3B8;
      --line:#E2E8F0;
      --line2:#CBD5E1;
      --card:#ffffff;
      --bg:#F8FAFC;
      --shadow-sm: 0 2px 8px rgba(0,0,0,.04);
      --shadow: 0 4px 20px rgba(8,145,178,.06), 0 1px 4px rgba(0,0,0,.04);
      --shadow-lg: 0 8px 32px rgba(8,145,178,.10), 0 2px 8px rgba(0,0,0,.06);
      --shadow-btn: 0 4px 14px rgba(8,145,178,.25);
      --btnH:52px;
      --radius:16px;
      --radius-lg:20px;
      --transition: .2s cubic-bezier(.4,0,.2,1);
      --header-h: 64px;
    }
    *{box-sizing:border-box; margin:0; padding:0;}

    /* ─── Skip Navigation (Accessibility) ─── */
    .skip-nav{
      position:absolute;
      left:-9999px; top:auto;
      width:1px; height:1px;
      overflow:hidden;
      z-index:100;
      padding:12px 20px;
      background:var(--primary);
      color:#fff;
      font-weight:700;
      font-size:14px;
      border-radius:0 0 8px 0;
      text-decoration:none;
    }
    .skip-nav:focus{
      left:0; top:0;
      width:auto; height:auto;
      overflow:visible;
    }

    /* ─── Body & Background ─── */
    body{
      background: var(--bg);
      color:var(--text);
      font-family:"Noto Sans JP", "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
      -webkit-tap-highlight-color: transparent;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      line-height: 1.6;
      min-height: 100dvh;
    }
    body::before{
      content:"";
      position:fixed; top:0; left:0; right:0;
      height:320px;
      background: linear-gradient(180deg, #E0F7FA 0%, var(--bg) 100%);
      z-index:-1;
      pointer-events:none;
    }

    /* ─── Header ─── */
    .top{
      position:sticky; top:0; z-index:20;
      height: var(--header-h);
      background:rgba(255,255,255,.85);
      backdrop-filter: blur(20px) saturate(1.8);
      -webkit-backdrop-filter: blur(20px) saturate(1.8);
      border-bottom:1px solid rgba(226,232,240,.8);
      padding:0 16px;
      display:flex; align-items:center; justify-content:space-between;
      gap:12px;
      transition: box-shadow var(--transition);
    }
    .top:hover{
      box-shadow: 0 1px 12px rgba(8,145,178,.06);
    }
    .brand{display:flex; align-items:center; gap:10px; min-width:0;}
    .brand b{
      font-family:"Figtree", "Noto Sans JP", sans-serif;
      font-size:19px; font-weight:900; letter-spacing:.3px;
      background: linear-gradient(135deg, var(--primary), var(--primary-dark));
      -webkit-background-clip:text; -webkit-text-fill-color:transparent;
      background-clip:text;
      white-space:nowrap;
    }
    .pill{
      display:inline-flex; align-items:center; gap:6px;
      font-size:12px; font-weight:700; color:var(--text2);
      background:var(--tint);
      border:1px solid var(--line);
      padding:5px 10px;
      border-radius:999px;
      max-width: 52vw;
      overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
      cursor:pointer;
      transition: all var(--transition);
    }
    .pill:active{
      transform: scale(.96);
      background: var(--tint3);
    }

    /* ─── Layout ─── */
    .wrap{max-width:680px; margin:0 auto; padding:16px 16px 140px;}
    .grid{display:grid; gap:12px;}

    /* ─── Cards ─── */
    .card{
      background:var(--card);
      border:1px solid var(--line);
      border-radius:var(--radius-lg);
      padding:18px;
      box-shadow: var(--shadow);
      animation: cardIn .35s cubic-bezier(.22,1,.36,1) both;
    }
    @keyframes cardIn{
      from{ opacity:0; transform:translateY(12px); }
      to{ opacity:1; transform:translateY(0); }
    }
    .card:nth-child(2){ animation-delay:.06s; }
    .card:nth-child(3){ animation-delay:.12s; }
    .card:nth-child(4){ animation-delay:.18s; }
    .card:nth-child(5){ animation-delay:.24s; }

    /* ─── Typography ─── */
    .h1{
      font-family:"Figtree", "Noto Sans JP", sans-serif;
      margin:0 0 4px; font-size:21px; font-weight:900;
      color: var(--text);
      letter-spacing: .3px;
    }
    .h2{
      font-family:"Figtree", "Noto Sans JP", sans-serif;
      margin:0 0 8px; font-size:15px; font-weight:900;
      color: var(--text2);
      letter-spacing: .2px;
    }
    .muted{color:var(--muted); font-size:13px; line-height:1.5; white-space:pre-wrap;}

    /* ─── Flex Row ─── */
    .row{display:flex; gap:10px; align-items:center; flex-wrap:wrap;}

    /* ─── Buttons ─── */
    .btn{
      height:var(--btnH);
      padding:0 18px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background:#fff;
      color:var(--text);
      font-size:16px;
      font-weight:700;
      letter-spacing:.2px;
      cursor:pointer;
      width:100%;
      box-shadow: var(--shadow-sm);
      touch-action: manipulation;
      transition: all .15s cubic-bezier(.4,0,.2,1);
      position:relative;
      overflow:hidden;
      font-family:inherit;
    }
    .btn::after{
      content:"";
      position:absolute; inset:0;
      background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(8,145,178,.06) 0%, transparent 60%);
      opacity:0;
      transition: opacity .3s;
      pointer-events:none;
    }
    .btn:hover::after{ opacity:1; }
    .btn:active{
      transform: scale(.97);
      box-shadow: 0 2px 6px rgba(0,0,0,.06);
    }
    .btn.small{
      height:42px; font-size:14px; font-weight:700;
      border-radius:12px; width:auto;
      padding:0 14px;
    }
    .btn.primary{
      background:linear-gradient(135deg, var(--primary) 0%, var(--primary2) 100%);
      color:#fff; border-color:transparent;
      box-shadow: var(--shadow-btn);
    }
    .btn.primary:active{
      box-shadow: 0 2px 8px rgba(8,145,178,.2);
      transform: scale(.97);
    }
    .btn.ghost{
      background:var(--tint);
      border-color: var(--line);
    }
    .btn.ghost:active{
      background: #DBEAFE;
    }
    .btn:disabled{
      opacity:.45; cursor:not-allowed;
      transform:none !important;
    }

    /* ─── Form Elements ─── */
    .input, .select, textarea{
      width:100%;
      border-radius:12px;
      border:1.5px solid var(--line);
      padding:12px 14px;
      font-size:16px;
      outline:none;
      background:#fff;
      touch-action: manipulation;
      font-family:inherit;
      color: var(--text);
      transition: border-color var(--transition), box-shadow var(--transition);
    }
    .input:focus, .select:focus, textarea:focus{
      border-color: var(--primary);
      box-shadow: 0 0 0 3px var(--primary-glow);
    }

    .select{
      height:50px;
      padding:0 14px;
      appearance:auto;
      -webkit-appearance:menulist;
      background:#fff;
    }

    textarea{
      min-height:110px;
      resize:vertical;
      line-height:1.6;
    }

    /* ─── List Items ─── */
    .listItem{
      display:flex; justify-content:space-between; align-items:flex-start;
      gap:10px;
      padding:12px 14px;
      border-radius:var(--radius);
      border:1px solid var(--line);
      background:#fff;
      transition: all .15s ease;
      cursor:default;
    }
    .listItem:active{
      background: var(--tint2);
      transform: scale(.99);
    }
    .listItem b{font-size:15px; font-weight:700; color:var(--text);}

    /* ─── Tags ─── */
    .tag{
      font-size:12px; font-weight:700;
      padding:4px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--tint);
      color:var(--muted);
      white-space:nowrap;
      letter-spacing:.2px;
    }

    /* ─── Scanner Video Box ─── */
    .videoBox{
      width:100%;
      aspect-ratio: 3 / 4;
      max-height: 60vh;
      border-radius:var(--radius-lg);
      overflow:hidden;
      border:2px solid rgba(8,145,178,.2);
      background:#0a0a0a;
      box-shadow: 0 8px 30px rgba(0,0,0,.12);
      position:relative;
    }
    .videoBox::after{
      content:"";
      position:absolute; inset:0;
      border:3px solid rgba(8,145,178,.4);
      border-radius:var(--radius-lg);
      animation: scanPulse 2s ease-in-out infinite;
      pointer-events:none;
    }
    @keyframes scanPulse{
      0%,100%{ border-color: rgba(8,145,178,.15); box-shadow: inset 0 0 20px rgba(8,145,178,.0); }
      50%{ border-color: rgba(8,145,178,.5); box-shadow: inset 0 0 30px rgba(8,145,178,.06); }
    }
    #scannerTarget video{width:100%; height:100%; object-fit:cover;}

    /* ─── Checkbox ─── */
    .check{
      width:24px; height:24px;
      accent-color: var(--primary);
      transform: scale(1.2);
      touch-action: manipulation;
      cursor:pointer;
    }

    /* ─── Divider ─── */
    .divider{
      height:1px;
      background: linear-gradient(90deg, transparent, var(--line), transparent);
      margin:12px 0;
    }

    /* ─── Summary Sticky Bar ─── */
    .summarySticky{
      position: sticky;
      top: calc(var(--header-h) + 4px);
      z-index: 15;
      margin-bottom: 12px;
    }
    .summaryCard{
      background:rgba(255,255,255,.90);
      backdrop-filter: blur(16px) saturate(1.6);
      -webkit-backdrop-filter: blur(16px) saturate(1.6);
      border:1px solid rgba(226,232,240,.6);
      border-radius:var(--radius);
      padding:10px 12px;
      box-shadow: 0 4px 20px rgba(8,145,178,.06);
    }
    .chipRow{display:flex; gap:6px; flex-wrap:wrap; align-items:center;}
    .chip{
      display:inline-flex; align-items:center; gap:5px;
      padding:6px 10px;
      border-radius:999px;
      border:1px solid var(--line);
      background:var(--tint);
      font-size:12px;
      font-weight:700;
      color:var(--text2);
      transition: all var(--transition);
    }
    .chip b{ font-weight:900; font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:.3px; }
    .chip.warn{
      background: #FEE2E2;
      border-color: rgba(220,38,38,.35);
      color: var(--danger);
      animation: chipWarn .6s ease;
    }
    @keyframes chipWarn{
      0%,100%{ transform:scale(1); }
      50%{ transform:scale(1.04); }
    }

    /* ─── Suggestion Box ─── */
    .sugBox{
      border:1px solid var(--line);
      border-radius:var(--radius);
      padding:12px;
      background: linear-gradient(180deg, #fff, var(--tint2));
    }
    .sugRow{display:flex; gap:8px; flex-wrap:wrap;}
    .sugNote{margin-top:8px; font-size:11px; color:var(--muted2); line-height:1.4;}

    /* ─── Toast Notification ─── */
    .toast{
      position:fixed;
      left:16px; right:16px; bottom:20px;
      z-index:50;
      background:rgba(255,255,255,.95);
      backdrop-filter: blur(20px) saturate(1.6);
      -webkit-backdrop-filter: blur(20px) saturate(1.6);
      border:1px solid rgba(8,145,178,.15);
      border-radius:var(--radius-lg);
      padding:16px 18px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12), 0 0 0 1px rgba(8,145,178,.06);
      pointer-events:none;
      transform: translateY(120%) scale(.95);
      opacity:0;
      transition: transform .4s cubic-bezier(.22,1,.36,1), opacity .4s cubic-bezier(.22,1,.36,1);
      max-width: 480px;
      margin: 0 auto;
    }
    .toast.show{
      transform: translateY(0) scale(1);
      opacity:1;
    }
    .toast .t{
      font-size:18px; font-weight:900;
      color: var(--text);
      display:flex; align-items:center; gap:8px;
    }
    .toast .t::before{
      content:"";
      width:8px; height:8px;
      border-radius:50%;
      background: var(--primary);
      flex-shrink:0;
      animation: toastDot .6s ease;
    }
    @keyframes toastDot{
      0%{ transform:scale(0); } 60%{ transform:scale(1.4); } 100%{ transform:scale(1); }
    }
    .toast .price{font-size:15px; font-weight:900; color:var(--primary); margin-top:4px; padding-left:16px;}
    .toast .s{font-size:13px; color:var(--muted); margin-top:2px; line-height:1.4; padding-left:16px;}

    /* ─── PWA install banner ─── */
    .pwa-banner{
      position:fixed;
      left:16px; right:16px; bottom:20px;
      z-index:40;
      background:rgba(255,255,255,.95);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border:1px solid rgba(8,145,178,.15);
      border-radius:var(--radius-lg);
      padding:20px;
      box-shadow: 0 12px 40px rgba(0,0,0,.12);
      text-align:center;
      max-width:480px;
      margin:0 auto;
      transform: translateY(120%);
      opacity:0;
      transition: transform .5s cubic-bezier(.22,1,.36,1), opacity .4s ease;
    }
    .pwa-banner.show{
      transform: translateY(0);
      opacity:1;
    }
    .pwa-banner .title{font-size:16px; font-weight:900; margin-bottom:6px; color:var(--text);}
    .pwa-banner .actions{display:flex; gap:8px; justify-content:center; margin-top:12px;}

    /* ─── Scrollbar ─── */
    ::-webkit-scrollbar{ width:6px; }
    ::-webkit-scrollbar-track{ background:transparent; }
    ::-webkit-scrollbar-thumb{ background:var(--line); border-radius:3px; }
    ::-webkit-scrollbar-thumb:hover{ background:var(--line2); }

    /* ─── Selection ─── */
    ::selection{
      background: rgba(8,145,178,.15);
      color: var(--text);
    }

    /* ─── Accessibility: Focus Visible ─── */
    :focus-visible{
      outline: 2px solid var(--primary);
      outline-offset: 2px;
    }
    .btn:focus-visible{
      outline: 2px solid var(--primary);
      outline-offset: 2px;
      box-shadow: 0 0 0 4px var(--primary-glow);
    }

    /* ─── Safe area (notch) ─── */
    @supports(padding: env(safe-area-inset-bottom)){
      .wrap{ padding-bottom: calc(140px + env(safe-area-inset-bottom)); }
      .toast{ bottom: calc(20px + env(safe-area-inset-bottom)); }
      .pwa-banner{ bottom: calc(20px + env(safe-area-inset-bottom)); }
    }

    /* ─── Reduced Motion ─── */
    @media (prefers-reduced-motion: reduce){
      *, *::before, *::after{
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ─── Label as h2 (a11y) ─── */
    label.h2{ display:block; cursor:default; }

    /* ─── Step Progress Indicator ─── */
    .step-progress{
      display:flex; align-items:center; justify-content:center;
      gap:0; margin-bottom:16px;
    }
    .step-dot{
      width:28px; height:28px;
      border-radius:50%;
      border:2px solid var(--line);
      background:#fff;
      display:flex; align-items:center; justify-content:center;
      font-size:12px; font-weight:700; color:var(--muted);
      transition: all var(--transition);
      flex-shrink:0;
    }
    .step-dot.active{
      background:var(--primary);
      border-color:var(--primary);
      color:#fff;
    }
    .step-dot.done{
      background:var(--tint);
      border-color:var(--primary);
      color:var(--primary);
    }
    .step-line{
      width:24px; height:2px;
      background:var(--line);
      flex-shrink:0;
    }
    .step-line.done{ background:var(--primary); }

    /* ─── Breadcrumb ─── */
    .breadcrumb{
      display:flex; align-items:center; gap:6px;
      font-size:12px; color:var(--muted);
      margin-bottom:12px;
      flex-wrap:wrap;
    }
    .breadcrumb a{
      color:var(--primary); text-decoration:none; font-weight:600;
    }
    .breadcrumb a:hover{ text-decoration:underline; }
    .breadcrumb span.sep{ color:var(--line2); }
    .breadcrumb span.current{ color:var(--text2); font-weight:700; }

    /* ─── Dark Mode ─── */
    @media (prefers-color-scheme: dark){
      :root{
        --primary:#22D3EE;
        --primary2:#67E8F9;
        --primary-dark:#0891B2;
        --primary-glow:rgba(34,211,238,.20);
        --tint:#164E63;
        --tint2:#1E3A4F;
        --tint3:#1A3B4D;
        --green:#34D399;
        --green-bg:#064E3B;
        --green-border:#065F46;
        --blue:#60A5FA;
        --amber:#FBBF24;
        --amber-bg:#451A03;
        --amber-light:#451A03;
        --amber-text:#FBBF24;
        --amber-border:#78350F;
        --danger:#F87171;
        --danger-light:#450A0A;
        --danger-glow:rgba(248,113,113,.18);
        --text:#F1F5F9;
        --text2:#CBD5E1;
        --muted:#94A3B8;
        --muted2:#64748B;
        --line:#334155;
        --line2:#475569;
        --card:#1E293B;
        --bg:#0F172A;
        --shadow-sm: 0 2px 8px rgba(0,0,0,.20);
        --shadow: 0 4px 20px rgba(0,0,0,.25), 0 1px 4px rgba(0,0,0,.15);
        --shadow-lg: 0 8px 32px rgba(0,0,0,.35), 0 2px 8px rgba(0,0,0,.20);
        --shadow-btn: 0 4px 14px rgba(34,211,238,.20);
      }
      body::before{ background: linear-gradient(180deg, #0C2D3E 0%, var(--bg) 100%); }
      .top{
        background:rgba(15,23,42,.85);
        border-bottom-color:rgba(51,65,85,.6);
      }
      .top:hover{ box-shadow: 0 1px 12px rgba(34,211,238,.06); }
      .brand b{
        background: linear-gradient(135deg, var(--primary), var(--primary2));
        -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;
      }
      .btn{ background:var(--card); border-color:var(--line); color:var(--text); }
      .btn::after{ background: radial-gradient(circle at var(--x,50%) var(--y,50%), rgba(34,211,238,.08) 0%, transparent 60%); }
      .btn:active{ box-shadow: 0 2px 6px rgba(0,0,0,.20); }
      .btn.primary{
        background:linear-gradient(135deg, #0891B2 0%, #22D3EE 100%);
        color:#0F172A; border-color:transparent;
      }
      .btn.ghost{ background:var(--tint); border-color:var(--line); }
      .btn.ghost:active{ background:#1E3A5F; }
      .input, .select, textarea{ background:var(--card); border-color:var(--line); color:var(--text); }
      .input:focus, .select:focus, textarea:focus{
        border-color:var(--primary);
        box-shadow: 0 0 0 3px var(--primary-glow);
      }
      .listItem{ background:var(--card); border-color:var(--line); }
      .listItem:active{ background:var(--tint); }
      .listItem b{ color:var(--text); }
      .tag{ background:var(--tint); border-color:var(--line); color:var(--muted); }
      .summaryCard{
        background:rgba(30,41,59,.90);
        border-color:rgba(51,65,85,.6);
      }
      .chip{ background:var(--tint); border-color:var(--line); color:var(--text2); }
      .chip.warn{ background:#450A0A; border-color:rgba(248,113,113,.35); color:var(--danger); }
      .sugBox{ background:linear-gradient(180deg, var(--card), var(--tint)); border-color:var(--line); }
      .toast{
        background:rgba(30,41,59,.95);
        border-color:rgba(34,211,238,.15);
        box-shadow: 0 12px 40px rgba(0,0,0,.30), 0 0 0 1px rgba(34,211,238,.06);
      }
      .toast .t{ color:var(--text); }
      .toast .t::before{ background:var(--primary); }
      .toast .price{ color:var(--primary); }
      .toast .s{ color:var(--muted); }
      .pwa-banner{
        background:rgba(30,41,59,.95);
        border-color:rgba(34,211,238,.15);
        box-shadow: 0 12px 40px rgba(0,0,0,.30);
      }
      .pwa-banner .title{ color:var(--text); }
      .videoBox{ border-color:rgba(34,211,238,.3); }
      .videoBox::after{ border-color:rgba(34,211,238,.4); }
      ::selection{ background:rgba(34,211,238,.25); color:var(--text); }
      ::-webkit-scrollbar-thumb{ background:var(--line); }
      ::-webkit-scrollbar-thumb:hover{ background:var(--line2); }
      .step-dot{ background:var(--card); border-color:var(--line); color:var(--muted); }
      .step-dot.active{ background:var(--primary); border-color:var(--primary); color:#0F172A; }
      .step-dot.done{ background:var(--tint); border-color:var(--primary); color:var(--primary); }
      .step-line{ background:var(--line); }
      .step-line.done{ background:var(--primary); }
      .billing-check--ok{ background:#064E3B; border-color:#065F46; color:#34D399; }
      .billing-check--ng{ background:#450A0A; border-color:#7F1D1D; color:#F87171; }
      .billing-check--warn{ background:#451A03; border-color:#78350F; color:#FBBF24; }
      .billing-check--confirm{ background:#1E3A5F; border-color:#1E40AF; color:#60A5FA; }
      .req-check-card{ background:var(--card); border-color:var(--line); }
      .req-badge-custom{ background:#1E3A5F; border-color:#3B82F6; color:#60A5FA; }
    }

    /* ─── Billing check result styles ─── */
    .billing-check { padding: 6px 8px; border-radius: 6px; margin-top: 4px; font-size: 12px; }
    .billing-check--ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #059669; }
    .billing-check--ng { background: #FEF2F2; border: 1px solid #FECACA; color: #DC2626; }
    .billing-check--warn { background: #fffbeb; border: 1px solid #fde68a; color: #d97706; }
    .billing-check--confirm { background: #eff6ff; border: 1px solid #bfdbfe; color: #2563eb; }
    .billing-check-msg { font-weight: 600; line-height: 1.4; }
    .req-check-card{border:1px solid var(--line);border-radius:var(--radius);padding:12px;background:#fff;margin-bottom:8px}
    .req-badge-custom{display:inline-flex;padding:2px 8px;border-radius:999px;font-size:11px;font-weight:700;background:#dbeafe;border:1px solid #93c5fd;color:#2563eb;margin-left:6px}
  </style>

  <script src="https://unpkg.com/@ericblade/quagga2@1.12.1/dist/quagga.min.js"></script>
</head>
<body>
  <a href="#app" class="skip-nav">メインコンテンツへスキップ</a>

  <header class="top" role="banner">
    <div class="brand">
      <b>LinQ VAL</b>
      <div class="pill" id="rolePill" aria-live="polite">職種：未選択</div>
    </div>
    <button class="btn small ghost" id="btnRole" aria-label="職種を変更">職種変更</button>
  </header>

  <div class="wrap">
    <div id="summaryHost" class="summarySticky" style="display:none;"></div>
    <main id="app"></main>
  </div>

  <div class="toast" id="toast" role="alert" aria-live="polite">
    <div class="t" id="toastTitle">OK</div>
    <div class="price" id="toastPrice"></div>
    <div class="s" id="toastSub"></div>
  </div>

  <div class="pwa-banner" id="pwaBanner">
    <div class="title">LinQ VALをホーム画面に追加</div>
    <div class="muted" style="margin-bottom:10px;">アプリのように素早くアクセスできます</div>
    <div class="actions">
      <button class="btn small primary" id="pwaInstall">追加する</button>
      <button class="btn small ghost" id="pwaDismiss">あとで</button>
    </div>
  </div>

  <script type="module" src="./app.js"></script>
  <script>
    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js").catch(function(){});
    }
    /* PWA install prompt */
    var deferredPrompt = null;
    window.addEventListener("beforeinstallprompt", function(e) {
      e.preventDefault();
      deferredPrompt = e;
      document.getElementById("pwaBanner").classList.add("show");
    });
    document.getElementById("pwaInstall").addEventListener("click", function() {
      if (deferredPrompt) {
        deferredPrompt.prompt();
        deferredPrompt.userChoice.then(function() { deferredPrompt = null; });
      }
      document.getElementById("pwaBanner").classList.remove("show");
    });
    document.getElementById("pwaDismiss").addEventListener("click", function() {
      document.getElementById("pwaBanner").classList.remove("show");
    });
  </script>
</body>
</html>
