<!DOCTYPE html>
<html><head><title>Icon Generator</title></head>
<body>
<h2>LinQ VAL Icon Generator</h2>
<p>Right-click each image and "Save image as..." to save the PNG files.</p>
<div id="out"></div>
<script>
const sizes = [192, 512];
const svg = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ff6b8d"/><stop offset="100%" stop-color="#ff3b6b"/>
  </linearGradient></defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <g fill="#fff" opacity="0.25">
    <rect x="80" y="160" width="8" height="192" rx="2"/>
    <rect x="100" y="160" width="4" height="192" rx="2"/>
    <rect x="116" y="160" width="12" height="192" rx="2"/>
    <rect x="140" y="160" width="6" height="192" rx="2"/>
    <rect x="158" y="160" width="10" height="192" rx="2"/>
    <rect x="180" y="160" width="4" height="192" rx="2"/>
  </g>
  <g transform="translate(256,256)" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <circle r="100" opacity="0.3"/><polyline points="-40,8 -10,40 50,-30"/>
  </g>
  <text x="256" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#fff" opacity="0.9">LinQ VAL</text>
</svg>`;

sizes.forEach(size => {
  const canvas = document.createElement('canvas');
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  const img = new Image();
  const blob = new Blob([svg], {type:'image/svg+xml'});
  img.onload = () => {
    ctx.drawImage(img, 0, 0, size, size);
    const png = canvas.toDataURL('image/png');
    const el = document.createElement('div');
    el.innerHTML = `<h3>icon-${size}.png</h3><img src="${png}" width="${size}" height="${size}">`;
    document.getElementById('out').appendChild(el);
    // Auto-download
    const a = document.createElement('a');
    a.href = png; a.download = `icon-${size}.png`; a.click();
  };
  img.src = URL.createObjectURL(blob);
});
</script>
</body></html>
