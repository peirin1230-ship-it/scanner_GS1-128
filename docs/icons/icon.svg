<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#0E7490"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fff" stop-opacity=".15"/>
      <stop offset="50%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <rect width="512" height="512" rx="112" fill="url(#shine)"/>

  <!-- Barcode lines (centered, balanced) -->
  <g fill="#fff" opacity=".9">
    <rect x="136" y="128" width="10" height="180" rx="3"/>
    <rect x="160" y="128" width="6"  height="180" rx="2"/>
    <rect x="178" y="128" width="14" height="180" rx="3"/>
    <rect x="206" y="128" width="8"  height="180" rx="2"/>
    <rect x="226" y="128" width="12" height="180" rx="3"/>
    <rect x="250" y="128" width="6"  height="180" rx="2"/>
    <rect x="268" y="128" width="10" height="180" rx="3"/>
    <rect x="290" y="128" width="14" height="180" rx="3"/>
    <rect x="318" y="128" width="6"  height="180" rx="2"/>
    <rect x="336" y="128" width="10" height="180" rx="3"/>
    <rect x="360" y="128" width="8"  height="180" rx="2"/>
    <rect x="380" y="128" width="6"  height="180" rx="2"/>
  </g>

  <!-- Scan line (horizontal) -->
  <rect x="116" y="210" width="280" height="3" rx="1.5" fill="#fff" opacity=".5"/>

  <!-- Validation check circle -->
  <circle cx="350" cy="350" r="80" fill="#fff" opacity=".15"/>
  <circle cx="350" cy="350" r="68" fill="#fff"/>
  <g transform="translate(350,350)" fill="none" stroke="#0891B2" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <polyline points="-28,4 -8,28 32,-22"/>
  </g>

  <!-- Brand text -->
  <text x="180" y="442" font-family="system-ui,Arial,sans-serif" font-size="52" font-weight="800" fill="#fff" letter-spacing="3" opacity=".95">LinQ</text>
</svg>
