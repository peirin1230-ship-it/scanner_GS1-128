<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff6b8d"/>
      <stop offset="100%" stop-color="#ff3b6b"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>
  <!-- Barcode lines -->
  <g fill="#fff" opacity="0.25">
    <rect x="80" y="160" width="8" height="192" rx="2"/>
    <rect x="100" y="160" width="4" height="192" rx="2"/>
    <rect x="116" y="160" width="12" height="192" rx="2"/>
    <rect x="140" y="160" width="6" height="192" rx="2"/>
    <rect x="158" y="160" width="10" height="192" rx="2"/>
    <rect x="180" y="160" width="4" height="192" rx="2"/>
  </g>
  <!-- Check mark -->
  <g transform="translate(256,256)" fill="none" stroke="#fff" stroke-width="28" stroke-linecap="round" stroke-linejoin="round">
    <circle r="100" opacity="0.3"/>
    <polyline points="-40,8 -10,40 50,-30"/>
  </g>
  <!-- LinQ text -->
  <text x="256" y="440" text-anchor="middle" font-family="Arial,sans-serif" font-size="56" font-weight="bold" fill="#fff" opacity="0.9">LinQ VAL</text>
</svg>
